version: "3"

services:
  api:
    build:
      context: ./apps/api
      dockerfile: dockerfiles/Dockerfile.dev
    volumes:
      - ./apps/api:/app
      - go-modules:/go/pkg/mod
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kuberan
      - DB_PASSWORD=kuberan
      - DB_NAME=kuberan
      - DB_SSLMODE=disable
      # JWT_SECRET signs the api's own access/refresh/bot tokens (HS256).
      # The mcp server no longer needs it: it validates Hydra-issued JWTs via JWKS.
      - JWT_SECRET=${JWT_SECRET:-fallback-secret-key-for-dev-only}
      - PIPELINE_API_KEY=${PIPELINE_API_KEY}
      - BOT_INTERNAL_SECRET=${BOT_INTERNAL_SECRET}
      # Receipt attachments (plan 017): the api reaches MinIO over the private
      # Docker network. These match the bucket + scoped service account that
      # minio-init provisions below.
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=kuberan-receipts
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-kuberan-receipts}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-kuberan-receipts-secret}
      - STORAGE_USE_PATH_STYLE=true
      # MCP write access (plan 022): must match the mcp service, since the api
      # registers and grants the write:* scopes the mcp server enforces.
      - MCP_WRITE_ENABLED=${MCP_WRITE_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: dockerfiles/Dockerfile.dev
    volumes:
      - ./apps/web:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    # NEXT_PUBLIC_API_URL is now auto-detected on the client side
    # Add it here only if you need to override the default behavior
    environment:
      - NEXT_PUBLIC_BOT_USERNAME=${NEXT_PUBLIC_BOT_USERNAME:-KuberanFinBot}
    depends_on:
      - api
    restart: unless-stopped

  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/bot:/app
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_BASE_URL=http://api:8080
      - BOT_INTERNAL_SECRET=${BOT_INTERNAL_SECRET}
      - LOG_LEVEL=INFO
    depends_on:
      - api
    profiles:
      - bot
    restart: unless-stopped

  oracle:
    build:
      context: ./apps/oracle
      dockerfile: Dockerfile
    environment:
      - KUBERAN_API_URL=http://api:8080
      - PIPELINE_API_KEY=${PIPELINE_API_KEY}
      - COMPUTE_SNAPSHOTS=true
      - LOG_LEVEL=info
    depends_on:
      - api
    profiles:
      - oracle
    restart: "no"

  mcp:
    build:
      context: ./apps/api
      dockerfile: dockerfiles/Dockerfile.dev
    command: go run ./cmd/mcp
    volumes:
      - ./apps/api:/app
      - go-modules:/go/pkg/mod
    ports:
      - "8081:8081"
    environment:
      - ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=kuberan
      - DB_PASSWORD=kuberan
      - DB_NAME=kuberan
      - DB_SSLMODE=disable
      - MCP_PORT=8081
      # The mcp server authenticates callers with Hydra-issued OAuth access
      # tokens, validated offline against Hydra's JWKS. It no longer needs
      # JWT_SECRET (the legacy static MCP token path was removed in Phase 4).
      - HYDRA_ISSUER_URL=${HYDRA_ISSUER_URL:-http://hydra:4444}
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-http://localhost:8081}
      # MCP write access (plan 022): registers the write tools. Keep in sync
      # with the api service. Limits default to $10,000 per change and
      # 30/minute, 500/day per connected app.
      - MCP_WRITE_ENABLED=${MCP_WRITE_ENABLED:-false}
      - MCP_MAX_WRITE_AMOUNT=${MCP_MAX_WRITE_AMOUNT:-1000000}
      - MCP_WRITE_RATE_PER_MINUTE=${MCP_WRITE_RATE_PER_MINUTE:-30}
      - MCP_WRITE_RATE_PER_DAY=${MCP_WRITE_RATE_PER_DAY:-500}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # One-shot: create/upgrade Hydra's schema in the dedicated `hydra` database.
  hydra-migrate:
    image: oryd/hydra:v25.4.0
    command: migrate sql -e --yes
    environment:
      - DSN=postgres://kuberan:kuberan@postgres:5432/hydra?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Ory Hydra: OAuth 2.1 Authorization Server for MCP. See plans/015-mcp-oauth-hydra.
  # Public API (:4444) is exposed; the admin API (:4445) MUST stay on the private
  # Docker network and is never published.
  hydra:
    image: oryd/hydra:v25.4.0
    command: serve all --dev --config /etc/config/hydra/hydra.yml
    ports:
      - "4444:4444" # public: authorize/token/discovery/DCR
      # :4445 (admin) intentionally NOT published - private network only.
    volumes:
      - ./ory/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    environment:
      - DSN=postgres://kuberan:kuberan@postgres:5432/hydra?sslmode=disable
      - SECRETS_SYSTEM=${HYDRA_SECRETS_SYSTEM:-dev-only-hydra-system-secret-change-me}
      - URLS_SELF_ISSUER=${HYDRA_ISSUER_URL:-http://localhost:4444}
      - URLS_LOGIN=${HYDRA_LOGIN_URL:-http://localhost:3000/oauth/login}
      - URLS_CONSENT=${HYDRA_CONSENT_URL:-http://localhost:3000/oauth/consent}
    depends_on:
      postgres:
        condition: service_healthy
      hydra-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # MinIO: S3-compatible object store for receipt attachments (plan 017).
  # The S3 API (:9000) stays on the private Docker network and is NEVER
  # published; only the api service talks to it. The console (:9001) is
  # published for local debugging convenience.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9001:9001" # console only; :9000 (S3 API) intentionally NOT published
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # One-shot: wait for MinIO, create the receipts bucket (private), and mint a
  # scoped service account whose keys the api uses. Idempotent — safe to re-run.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin}";
        do echo 'waiting for minio...'; sleep 1; done &&
        mc mb --ignore-existing local/kuberan-receipts &&
        mc anonymous set none local/kuberan-receipts &&
        mc version enable local/kuberan-receipts &&
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::kuberan-receipts/*"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::kuberan-receipts"]}]}' > /tmp/receipts-policy.json &&
        (mc admin user svcacct info local "$${STORAGE_ACCESS_KEY:-kuberan-receipts}" >/dev/null 2>&1 &&
        mc admin user svcacct edit --policy /tmp/receipts-policy.json
        local "$${STORAGE_ACCESS_KEY:-kuberan-receipts}" ||
        mc admin user svcacct add
        --access-key "$${STORAGE_ACCESS_KEY:-kuberan-receipts}"
        --secret-key "$${STORAGE_SECRET_KEY:-kuberan-receipts-secret}"
        --policy /tmp/receipts-policy.json
        local "$${MINIO_ROOT_USER:-minioadmin}") &&
        POLICY=$$(mc --json admin user svcacct info local "$${STORAGE_ACCESS_KEY:-kuberan-receipts}") &&
        case "$$POLICY" in
        *GetObject*) echo 'minio-init: least-privilege service-account policy verified' ;;
        *) echo 'minio-init: ERROR service account is missing its scoped policy (would inherit root)' >&2; exit 1 ;;
        esac
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-kuberan-receipts}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-kuberan-receipts-secret}
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: kuberan-postgres
    environment:
      POSTGRES_USER: kuberan
      POSTGRES_PASSWORD: kuberan
      POSTGRES_DB: kuberan
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/dev/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuberan"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  go-modules:
  node_modules:
  minio_data:
  postgres_data:
    driver: local
