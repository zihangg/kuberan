# Ory Hydra configuration for Kuberan MCP OAuth 2.1.
# See plans/015-mcp-oauth-hydra. Pinned to Hydra v2.x.
#
# Secrets and the DSN are supplied via environment variables in docker-compose
# (SECRETS_SYSTEM, DSN) so they are not committed here.

serve:
  public:
    port: 4444
  admin:
    port: 4445
  cookies:
    same_site_mode: Lax

urls:
  self:
    # Public issuer. Must match the hostname cloudflared serves in prod
    # (e.g. https://auth.<domain>). Overridden via URLS_SELF_ISSUER.
    issuer: http://localhost:4444
  # Login & consent UI live in apps/web (Next.js). Overridden via env in prod.
  login: http://localhost:3000/oauth/login
  consent: http://localhost:3000/oauth/consent

strategies:
  access_token: jwt

ttl:
  access_token: 15m
  # Refresh tokens rotate on every use and each new one gets a fresh TTL, so
  # this is an idle timeout: a long-running MCP client (e.g. an agent that may
  # sit unused for weeks) stays connected as long as it refreshes within 90d.
  refresh_token: 2160h
  id_token: 1h
  auth_code: 10m

oauth2:
  # Never leak internal error details to clients.
  expose_internal_errors: false
  pkce:
    # Hydra does NOT require PKCE by default, not even for public clients.
    # Every DCR client is public (token_endpoint_auth_method=none, forced by
    # the proxy), so require PKCE for all of them: without it a stolen
    # authorization code could be redeemed by anyone. Only the S256 method is
    # accepted (Hydra does not enable "plain").
    enforced_for_public_clients: true
    # Left off so a confidential client pinned via HYDRA_PINNED_CLIENT_ID (one
    # that authenticates with a client secret) keeps working if it does not
    # send PKCE. Turn on if no confidential client is ever registered.
    enforced: false
  grant:
    refresh_token:
      # Keep a just-rotated refresh token usable briefly. Without this, a client
      # that refreshes twice concurrently, or retries after a lost response,
      # presents a spent token; Hydra treats that as token reuse and revokes
      # the whole chain, disconnecting the client. 5m is Hydra's max without a
      # reuse count.
      rotation_grace_period: 5m

oidc:
  subject_identifiers:
    supported_types:
      - public

webfinger:
  oidc_discovery:
    # Advertised as registration_endpoint in both discovery documents. Points
    # at the hardened DCR proxy in apps/api (plan 015 Phase 5), NOT a Hydra
    # endpoint: without this key Hydra omits registration_endpoint entirely and
    # MCP clients cannot discover where to self-register. Overridden in prod
    # via WEBFINGER_OIDC_DISCOVERY_CLIENT_REGISTRATION_URL.
    client_registration_url: http://localhost:8080/oauth2/register

# Scope handling is deliberately NOT configured here: Hydra v2.x has no global
# scope registry. Allowed scopes are set per client (client.scope), so the
# granular read:* set is enforced code-side instead:
#   - DCR registration proxy caps a client's registrable scopes
#     (apps/api/internal/handlers/registration_handler.go, capScopes).
#   - The consent bridge grants only the registered read:* subset
#     (apps/api/internal/handlers/oauth_handler.go).
#   - The MCP Resource Server enforces the required scope per tool
#     (apps/api/internal/mcp, requireScope).
# The canonical read:* set lives in config.DefaultOAuthScopes.
