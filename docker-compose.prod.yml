# Production stack. Run via deploy/deploy.sh, which builds images tagged by git
# SHA, backs up, migrates and starts everything health-gated. Every
# ${VAR} below is interpolated from .env.prod (deploy.sh passes
# --env-file .env.prod and also symlinks it to .env so ad-hoc
# `docker compose -f docker-compose.prod.yml ...` commands see the same values).
#
# Each service receives ONLY the variables it needs, listed explicitly under
# `environment:` (no shared env_file), so e.g. the bot never sees the DB
# password and Hydra never sees JWT_SECRET. Upgrade notes:
# docs/backup-and-dr.md#upgrade-notes.
#
# Networks (fixed subnets so trusted-proxy CIDRs can be narrow):
#   edge        ${KUBERAN_SUBNET_PREFIX}.10.0/24  egress + published ports. api, mcp, hydra,
#               web, bot, oracle, backup, hydra-migrate. Host-local tunnel
#               traffic arrives from its gateway (.10.1).
#   db          internal (no egress). postgres + the services that need SQL.
#   storage     internal. minio + api/backup/minio-init.
#   hydra-admin internal. ONLY hydra + api. Hydra's admin API listens solely on
#               hydra's fixed address on this network, so no other container
#               (bot, web, mcp, oracle...) can reach :4445 at all.
# Every service with published ports has exactly one non-internal network
# (edge), so Docker always forwards published ports through edge.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Baseline for every service: no privilege escalation, rotated logs.
x-base: &base
  security_opt:
    - no-new-privileges:true
  logging: *logging

# Baseline + no Linux capabilities. Used by every service whose process runs
# unprivileged and binds only high ports (all except postgres).
x-hardened: &hardened
  <<: *base
  cap_drop:
    - ALL

x-dns: &dns
  - 8.8.8.8
  - 8.8.4.4

x-tmpfs: &tmpfs
  - /tmp:size=64m,mode=1777

# Database settings shared by the api, mcp and migrate runs.
x-db-env: &db-env
  DB_HOST: ${DB_HOST:?DB_HOST is required}
  DB_PORT: ${DB_PORT:-5432}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_SSLMODE: ${DB_SSLMODE:-}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-}

services:
  postgres:
    <<: *base
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [db]
    shm_size: 256m
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *hardened
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: kuberan-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs: *tmpfs
    environment:
      <<: *db-env
      ENV: ${ENV:-production}
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
      PIPELINE_API_KEY: ${PIPELINE_API_KEY:-}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required (e.g. https://app.example.com)}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Proxies whose X-Forwarded-For the api trusts (the edge gateway).
      API_TRUSTED_PROXY_CIDRS: ${API_TRUSTED_PROXY_CIDRS:-}
      # OAuth login/consent bridge + DCR proxy (plan 015). The admin API is
      # reached ONLY via the hydra-admin network alias; the value is fixed here
      # (an old HYDRA_ADMIN_URL=http://hydra:4445 in .env.prod is ignored).
      HYDRA_ISSUER_URL: ${HYDRA_ISSUER_URL:?HYDRA_ISSUER_URL is required}
      HYDRA_ADMIN_URL: http://hydra-admin:4445
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:?MCP_RESOURCE_URL is required}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-}
      HYDRA_PINNED_CLIENT_ID: ${HYDRA_PINNED_CLIENT_ID:-}
      # MCP write access (plan 022): must match the mcp service.
      MCP_WRITE_ENABLED: ${MCP_WRITE_ENABLED:-false}
      # Receipt attachments (plan 017). The S3 API is reached over the private
      # storage network; MinIO is NEVER published to the tunnel. Keys are the
      # scoped service account minted by minio-init.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kuberan-receipts}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      STORAGE_USE_PATH_STYLE: "true"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-}
      MAX_ATTACHMENTS_PER_TX: ${MAX_ATTACHMENTS_PER_TX:-}
    dns: *dns
    networks:
      edge: {}
      db: {}
      storage: {}
      hydra-admin: {}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Loopback only: the host-run Cloudflare tunnel connects to 127.0.0.1.
    # See docs/backup-and-dr.md#upgrade-notes if your tunnel runs elsewhere.
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:8080:8080"

  mcp:
    <<: *hardened
    # Same image as api (built by the api service); run the MCP binary.
    # The MCP server is an OAuth Resource Server: it validates Hydra-issued
    # access tokens offline against Hydra's JWKS.
    image: kuberan-api:${IMAGE_TAG:-latest}
    pull_policy: never
    entrypoint: ["/mcp"]
    restart: unless-stopped
    read_only: true
    tmpfs: *tmpfs
    environment:
      <<: *db-env
      ENV: ${ENV:-production}
      MCP_PORT: "8081"
      # config.Load() validates JWT_SECRET (and CORS) in production for every
      # binary, so mcp still needs them although it never signs api tokens.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required (e.g. https://app.example.com)}
      # The RS fetches JWKS from, and validates iss against, the PUBLIC issuer.
      HYDRA_ISSUER_URL: ${HYDRA_ISSUER_URL:?HYDRA_ISSUER_URL is required}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:?MCP_RESOURCE_URL is required}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-}
      MCP_WRITE_ENABLED: ${MCP_WRITE_ENABLED:-false}
      MCP_MAX_WRITE_AMOUNT: ${MCP_MAX_WRITE_AMOUNT:-}
      MCP_WRITE_RATE_PER_MINUTE: ${MCP_WRITE_RATE_PER_MINUTE:-}
      MCP_WRITE_RATE_PER_DAY: ${MCP_WRITE_RATE_PER_DAY:-}
      MCP_TRUSTED_PROXY_CIDRS: ${MCP_TRUSTED_PROXY_CIDRS:-}
    dns: *dns
    networks:
      edge: {}
      db: {}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      hydra:
        condition: service_healthy
    mem_limit: 384m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:8081:8081"

  # One-shot: create/upgrade Hydra's schema in its dedicated `hydra` database.
  # HYDRA_DSN points at the same Postgres/Supabase instance, own database.
  hydra-migrate:
    <<: *hardened
    image: oryd/hydra:v25.4.0
    command: migrate sql -e --yes
    read_only: true
    tmpfs: *tmpfs
    environment:
      DSN: ${HYDRA_DSN:?HYDRA_DSN is required}
    dns: *dns
    networks:
      edge: {}
      db: {}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    mem_limit: 256m
    pids_limit: 128
    restart: "no"

  # Ory Hydra: OAuth 2.1 Authorization Server for MCP (plan 015-mcp-oauth-hydra).
  # The public API (:4444) is published on loopback for the Cloudflare tunnel.
  # The admin API (:4445) binds ONLY to hydra's fixed address on the internal
  # hydra-admin network (SERVE_ADMIN_HOST), which only the api joins.
  hydra:
    <<: *hardened
    image: oryd/hydra:v25.4.0
    command: serve all --config /etc/config/hydra/hydra.yml
    read_only: true
    tmpfs: *tmpfs
    environment:
      DSN: ${HYDRA_DSN:?HYDRA_DSN is required}
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:?HYDRA_SECRETS_SYSTEM is required}
      URLS_SELF_ISSUER: ${HYDRA_ISSUER_URL:?HYDRA_ISSUER_URL is required}
      URLS_LOGIN: ${HYDRA_LOGIN_URL:?HYDRA_LOGIN_URL is required}
      URLS_CONSENT: ${HYDRA_CONSENT_URL:?HYDRA_CONSENT_URL is required}
      SERVE_ADMIN_HOST: ${KUBERAN_SUBNET_PREFIX:-172.30}.13.10
      # The Cloudflare tunnel terminates TLS and forwards plain HTTP, so Hydra
      # trusts X-Forwarded-Proto from the edge gateway the tunnel arrives on.
      # 127.0.0.1 lets the container healthcheck pass the same check.
      SERVE_TLS_ALLOW_TERMINATION_FROM: 127.0.0.1/32,${HYDRA_TLS_TERMINATION_CIDR:-172.30.10.0/24}
      # Advertised as registration_endpoint in the discovery documents; the
      # tunnel routes this exact path to the hardened DCR proxy in apps/api.
      WEBFINGER_OIDC_DISCOVERY_CLIENT_REGISTRATION_URL: ${HYDRA_ISSUER_URL:?HYDRA_ISSUER_URL is required}/oauth2/register
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:4444:4444"
    volumes:
      - ./ory/hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    dns: *dns
    networks:
      edge: {}
      db: {}
      hydra-admin:
        ipv4_address: ${KUBERAN_SUBNET_PREFIX:-172.30}.13.10
        aliases: [hydra-admin]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      hydra-migrate:
        condition: service_completed_successfully
    mem_limit: 384m
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "--header",
          "X-Forwarded-Proto: https",
          "http://127.0.0.1:4444/health/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    <<: *hardened
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_BOT_USERNAME: ${NEXT_PUBLIC_BOT_USERNAME:-KuberanFinBot}
    image: kuberan-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      edge: {}
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      # node is always present in the image (no reliance on wget/curl).
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:3000:3000"

  # One-shot price ingestion + snapshots, run by the host cron
  # (`docker compose -f docker-compose.prod.yml run --rm oracle`).
  oracle:
    <<: *hardened
    build:
      context: ./apps/oracle
      dockerfile: Dockerfile
    image: kuberan-oracle:${IMAGE_TAG:-latest}
    read_only: true
    tmpfs: *tmpfs
    environment:
      KUBERAN_API_URL: http://api:8080
      PIPELINE_API_KEY: ${PIPELINE_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-}
      COMPUTE_SNAPSHOTS: ${COMPUTE_SNAPSHOTS:-}
      PROCESS_FIXED_DEPOSITS: ${PROCESS_FIXED_DEPOSITS:-}
      TARGET_CURRENCY: ${TARGET_CURRENCY:-}
    dns: *dns
    networks:
      edge: {}
    profiles:
      - oracle
    mem_limit: 256m
    pids_limit: 128
    restart: "no"

  bot:
    <<: *hardened
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    image: kuberan-bot:${IMAGE_TAG:-latest}
    read_only: true
    tmpfs: *tmpfs
    environment:
      API_BASE_URL: http://api:8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    dns: *dns
    # Only talks HTTP to the api and to Telegram: not on the db network.
    networks:
      edge: {}
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    pids_limit: 128
    # Healthcheck (job-queue heartbeat) is defined in apps/bot/Dockerfile.
    restart: unless-stopped

  # Public ingress is an EXTERNAL Cloudflare tunnel (managed outside this repo)
  # running on the host; it reaches the services via the loopback-published
  # ports above. Configure the tunnel's public hostnames to map ONLY:
  #   auth.<domain> (path /oauth2/register) -> http://127.0.0.1:8080 (hardened DCR proxy)
  #   auth.<domain> (all other paths)       -> http://127.0.0.1:4444 (OAuth AS)
  #   mcp.<domain>  -> http://127.0.0.1:8081  (MCP Resource Server + discovery)
  #   app.<domain>  -> http://127.0.0.1:3000  (login/consent pages + web app)
  #   api.<domain>  -> http://127.0.0.1:8080  (REST API, if exposed)
  # DCR MUST route to the api proxy, not Hydra: Hydra advertises its
  # registration_endpoint as https://auth.<domain>/oauth2/register, and the api
  # container serves that exact path (see cmd/api/main.go) with the Phase 5
  # hardening (public clients, capped scopes, audit/alert). Routing /oauth2/register
  # straight to Hydra would bypass every one of those controls.
  # Hydra admin (:4445) is never published and unreachable from the host.

  # MinIO: S3-compatible object store for receipt attachments (plan 017 Phase 4).
  # INTERNAL ONLY — neither the S3 API (:9000) nor the console (:9001) is
  # published, and it sits only on the internal storage network.
  # Upstream minio/minio and minio/mc images are no longer published on Docker
  # Hub, so this pins the community-maintained fork (same server, same on-disk
  # format) by tag and digest. Override with MINIO_IMAGE (see upgrade notes).
  minio:
    <<: *hardened
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      storage: {}
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: wait for MinIO, create the receipts bucket (private), enable
  # versioning (guards against accidental/malicious object deletes and feeds
  # Phase 0's off-host R2 mirror), and mint a scoped service account whose keys
  # the api uses. Idempotent — safe to re-run on every deploy. Uses the MinIO
  # server image, which ships the matching `mc` client.
  minio-init:
    <<: *hardened
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    read_only: true
    tmpfs: *tmpfs
    depends_on:
      minio:
        condition: service_healthy
    networks:
      storage: {}
    mem_limit: 128m
    pids_limit: 64
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        do echo 'waiting for minio...'; sleep 1; done &&
        mc mb --ignore-existing local/"$${STORAGE_BUCKET:-kuberan-receipts}" &&
        mc anonymous set none local/"$${STORAGE_BUCKET:-kuberan-receipts}" &&
        mc version enable local/"$${STORAGE_BUCKET:-kuberan-receipts}" &&
        BUCKET="$${STORAGE_BUCKET:-kuberan-receipts}" &&
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::%s/*"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::%s"]}]}' "$${BUCKET}" "$${BUCKET}" > /tmp/receipts-policy.json &&
        (mc admin user svcacct info local "$${STORAGE_ACCESS_KEY}" >/dev/null 2>&1 &&
        mc admin user svcacct edit --policy /tmp/receipts-policy.json
        local "$${STORAGE_ACCESS_KEY}" ||
        mc admin user svcacct add
        --access-key "$${STORAGE_ACCESS_KEY}"
        --secret-key "$${STORAGE_SECRET_KEY}"
        --policy /tmp/receipts-policy.json
        local "$${MINIO_ROOT_USER}") &&
        POLICY=$$(mc --json admin user svcacct info local "$${STORAGE_ACCESS_KEY}") &&
        case "$$POLICY" in
        *GetObject*) echo 'minio-init: least-privilege service-account policy verified' ;;
        *) echo 'minio-init: ERROR service account is missing its scoped policy (would inherit root)' >&2; exit 1 ;;
        esac
    environment:
      # mc keeps its alias config here (read-only root filesystem).
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-kuberan-receipts}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
    restart: "no"

  backup:
    <<: *hardened
    build:
      context: ./apps/backup
      dockerfile: Dockerfile
    image: kuberan-backup:${IMAGE_TAG:-latest}
    profiles:
      - backup
    read_only: true
    tmpfs: *tmpfs
    # Wait for minio-init to finish so the receipts bucket and the scoped
    # service account rclone mirrors with already exist. Without this, a host
    # reboot could fire the backup cron before MinIO is provisioned, failing the
    # receipts sync and spuriously tripping the dead-man's-switch even though the
    # DB dump succeeded.
    depends_on:
      minio-init:
        condition: service_completed_successfully
    # Off-host encrypted replication (plans/017 Phase 0) and the receipts
    # mirror (Phase 4); consumed by backup.sh. Only the RCLONE_CONFIG_* keys
    # listed here are forwarded: add any extra rclone option here too.
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      # pg_dump requires a direct connection, not Supavisor's pooler (6543).
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_SSLMODE: ${DB_SSLMODE:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HYDRA_DB_NAME: ${BACKUP_HYDRA_DB_NAME-hydra}
      BACKUP_REQUIRE_OFFHOST: ${BACKUP_REQUIRE_OFFHOST:-false}
      RECEIPTS_BUCKET: ${STORAGE_BUCKET:-kuberan-receipts}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      RESTORE_TEST_ENABLED: ${RESTORE_TEST_ENABLED:-false}
      RESTORE_TEST_HEALTHCHECK_URL: ${RESTORE_TEST_HEALTHCHECK_URL:-}
      RCLONE_CONFIG_R2_TYPE: ${RCLONE_CONFIG_R2_TYPE:-}
      RCLONE_CONFIG_R2_PROVIDER: ${RCLONE_CONFIG_R2_PROVIDER:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${RCLONE_CONFIG_R2_ENDPOINT:-}
      RCLONE_CONFIG_R2CRYPT_TYPE: ${RCLONE_CONFIG_R2CRYPT_TYPE:-}
      RCLONE_CONFIG_R2CRYPT_REMOTE: ${RCLONE_CONFIG_R2CRYPT_REMOTE:-}
      RCLONE_CONFIG_R2CRYPT_PASSWORD: ${RCLONE_CONFIG_R2CRYPT_PASSWORD:-}
      RCLONE_CONFIG_R2CRYPT_PASSWORD2: ${RCLONE_CONFIG_R2CRYPT_PASSWORD2:-}
      RCLONE_CONFIG_MINIO_TYPE: ${RCLONE_CONFIG_MINIO_TYPE:-}
      RCLONE_CONFIG_MINIO_PROVIDER: ${RCLONE_CONFIG_MINIO_PROVIDER:-}
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${RCLONE_CONFIG_MINIO_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_MINIO_ENDPOINT: ${RCLONE_CONFIG_MINIO_ENDPOINT:-}
    dns: *dns
    networks:
      edge: {}
      db: {}
      storage: {}
    volumes:
      # Must be writable by uid 10001 (deploy.sh fixes ownership).
      - ./backups:/backups
    mem_limit: 1g
    pids_limit: 128
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: ${KUBERAN_SUBNET_PREFIX:-172.30}.10.0/24
  db:
    internal: true
    ipam:
      config:
        - subnet: ${KUBERAN_SUBNET_PREFIX:-172.30}.11.0/24
  storage:
    internal: true
    ipam:
      config:
        - subnet: ${KUBERAN_SUBNET_PREFIX:-172.30}.12.0/24
  hydra-admin:
    internal: true
    ipam:
      config:
        - subnet: ${KUBERAN_SUBNET_PREFIX:-172.30}.13.0/24

volumes:
  postgres_data:
  minio_data:
