      conditions:
        items:
          $ref: '#/definitions/internal_handlers.RuleConditionDTO'
        minItems: 1
        type: array
      is_active:
        type: boolean
      name:
        maxLength: 120
        minLength: 1
        type: string
      priority:
        type: integer
    type: object
  internal_handlers.UpdateTransactionRequest:
    properties:
      account_id:
        type: string
      amount:
        type: integer
      category_id:
