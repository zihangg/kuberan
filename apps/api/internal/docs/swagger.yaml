        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account investments
      tags:
      - investments
  /accounts/{id}/transactions:
    get:
      consumes:
      - application/json
      description: Get a paginated list of transactions for a specific account with
        optional filters
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      - description: Filter by start date (RFC3339 e.g. 2024-01-01T00:00:00Z, or YYYY-MM-DD)
        in: query
        name: from_date
        type: string
      - description: Filter by end date (RFC3339 or YYYY-MM-DD)
        in: query
        name: to_date
        type: string
      - description: Filter by transaction type (income, expense, transfer, investment)
        in: query
        name: type
        type: string
      - description: Filter by category ID
        in: query
        name: category_id
        type: integer
      - description: Filter by minimum amount (cents)
        in: query
        name: min_amount
        type: integer
      - description: Filter by maximum amount (cents)
        in: query
        name: max_amount
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated transactions
          schema:
            $ref: '#/definitions/kuberan_internal_pagination.PageResponse-kuberan_internal_models_Transaction'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account transactions
      tags:
      - accounts
      - transactions
