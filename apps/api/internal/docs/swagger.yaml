    - description
    - amount
    - account_id
    - type
    type: string
    x-enum-varnames:
    - RuleFieldDescription
    - RuleFieldAmount
    - RuleFieldAccountID
    - RuleFieldType
  kuberan_internal_models.RuleOperator:
