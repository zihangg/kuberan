      id:
        type: string
      quantity:
        type: number
      realized_gain_loss:
        type: integer
      security:
        allOf:
        - $ref: '#/definitions/kuberan_internal_models.Security'
        description: Relationships
      security_id:
        type: string
      total_invested:
        description: 'Populated at query time: sum of buy transaction amounts'
        type: integer
      transactions:
        items:
          $ref: '#/definitions/kuberan_internal_models.InvestmentTransaction'
        type: array
      updated_at:
        type: string
      wallet_address:
        type: string
    type: object
  kuberan_internal_models.InvestmentTransaction:
    properties:
