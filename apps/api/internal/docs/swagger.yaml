    - contains
    - not_contains
    - equals
    - starts_with
    - ends_with
    - gt
    - lt
    - between
    type: string
    x-enum-varnames:
    - RuleOpContains
    - RuleOpNotContains
    - RuleOpEquals
    - RuleOpStartsWith
    - RuleOpEndsWith
    - RuleOpGt
    - RuleOpLt
    - RuleOpBetween
  kuberan_internal_models.Security:
    properties:
      asset_type:
        $ref: '#/definitions/kuberan_internal_models.AssetType'
      coupon_rate:
        type: number
      created_at:
        type: string
      currency:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      exchange:
        type: string
      id:
        type: string
      maturity_date:
        type: string
      name:
        type: string
      network:
        type: string
      property_type:
        type: string
      provider_symbol:
        type: string
      symbol:
        type: string
      updated_at:
        type: string
      yield_to_maturity:
        type: number
    type: object
  kuberan_internal_models.SecurityPrice:
    properties:
      id:
        type: string
      price:
        type: integer
      recorded_at:
        type: string
      security:
        $ref: '#/definitions/kuberan_internal_models.Security'
      security_id:
        type: string
    type: object
  kuberan_internal_models.Transaction:
    properties:
      account:
        allOf:
        - $ref: '#/definitions/kuberan_internal_models.Account'
        description: Relationships
      account_id:
        type: string
      amount:
        type: integer
      attachments:
        description: |-
          Attachments are receipt images/PDFs. Preloaded only on detail queries
          (not on list). See plans/017-transaction-receipts.
        items:
          $ref: '#/definitions/kuberan_internal_models.TransactionAttachment'
        type: array
      attachments_count:
        description: |-
          AttachmentsCount is a derived (non-persisted) count of receipts, populated
          on list queries so the UI can show a paperclip indicator without loading
          the attachment rows. See plans/017-transaction-receipts.
        type: integer
      category:
        $ref: '#/definitions/kuberan_internal_models.Category'
      category_id:
        type: string
      created_at:
        type: string
      date:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      id:
        type: string
      to_account:
        $ref: '#/definitions/kuberan_internal_models.Account'
      to_account_id:
