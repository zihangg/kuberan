basePath: /api/v1
definitions:
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  internal_handlers.AccountResponse:
    properties:
      balance:
        type: integer
      currency:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      type:
        $ref: '#/definitions/kuberan_internal_models.AccountType'
      user_id:
        type: integer
    type: object
  internal_handlers.AddInvestmentRequest:
    properties:
      account_id:
        type: string
      date:
        description: optional, defaults to now
        type: string
      fee:
        description: optional, defaults to 0
        minimum: 0
        type: integer
      notes:
        description: optional, defaults to "Initial purchase"
        maxLength: 500
        type: string
      purchase_price:
        type: integer
      quantity:
        type: number
      security_id:
        type: string
      wallet_address:
        type: string
    required:
    - account_id
    - purchase_price
    - quantity
    - security_id
    type: object
  internal_handlers.ApplyRuleRequest:
    properties:
      dry_run:
        description: default true
        type: boolean
      overwrite:
        description: only meaningful with scope=all
        type: boolean
      scope:
        description: uncategorized | all (default uncategorized)
        type: string
    type: object
  internal_handlers.AttachmentResponse:
    properties:
      attachment:
        $ref: '#/definitions/kuberan_internal_models.TransactionAttachment'
    type: object
  internal_handlers.AttachmentsResponse:
