      grant_types:
        items:
          type: string
        type: array
      redirect_uris:
        items:
          type: string
        type: array
      response_types:
        items:
          type: string
        type: array
      scope:
        type: string
      token_endpoint_auth_method:
        type: string
    type: object
  kuberan_internal_models.Account:
