      interest_rate:
        maximum: 100
        minimum: 0
        type: number
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  internal_handlers.CreateInvestmentAccountRequest:
    properties:
      account_number:
