      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: string
      type:
        $ref: '#/definitions/kuberan_internal_models.CategoryType'
      user_id:
        type: integer
    type: object
  internal_handlers.CompleteLinkRequest:
